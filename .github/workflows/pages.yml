# Bouwt ShopMatch en publiceert via GitHub Pages.
# LIVE sinds 17-10-2026 (akkoord Dave): BASE leeg, GO_LIVE=1 → https://shopmatch.nl (indexeerbaar, CNAME shopmatch.nl).
# LIVEGANG (pas na akkoord Dave): BASE leeg en GO_LIVE=1 (schrijft CNAME shopmatch.nl), custom domain in Pages-instellingen.
name: Deploy ShopMatch
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
env:
  BASE: ''
  GO_LIVE: '1'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # L7: basis = github.event.before moet in de clone zitten
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: echo "PUSH_DATE=$(TZ=Europe/Amsterdam date +%F)" >> "$GITHUB_ENV"
      - run: npm test
        env:
          L7_BASE: ${{ github.event.before }} # L7 vergelijkt met wat live stond, niet HEAD met zichzelf
          PUSH_DATE: ${{ env.PUSH_DATE }}
          BUILD_DATE: ${{ env.PUSH_DATE }}
      - run: npm run build
        env:
          PUSH_DATE: ${{ env.PUSH_DATE }}
          BUILD_DATE: ${{ env.PUSH_DATE }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
